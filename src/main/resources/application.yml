spring:
  application:
    name: agent-eval-workbench
  profiles:
    default: local

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  benchmark:
    job-timeout-seconds: ${BENCHMARK_JOB_TIMEOUT_SECONDS:300}
    worker-lease-seconds: ${BENCHMARK_WORKER_LEASE_SECONDS:30}
    sweep-ms: ${BENCHMARK_SWEEP_MS:5000}
